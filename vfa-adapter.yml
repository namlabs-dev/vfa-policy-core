scan: >-
  curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/main/scripts/install.sh
  | sh -s -- -b /usr/local/bin v8.21.2
  && gitleaks detect --source . --redact --exit-code 1

lint: "yarn install --frozen-lockfile && npx eslint \"src/**/*.ts\" --max-warnings 0"
build: "yarn build"
test: >-
  npx jest
  --coverage
  --coverageReporters=json-summary
  --coverageReporters=text
  --coverageReporters=lcov
  --detectOpenHandles
  --runInBand
  --forceExit
coverage_cmd: >-
  node -e
  "process.stdout.write(String(require('./coverage/coverage-summary.json').total.lines.pct))"
